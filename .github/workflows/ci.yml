name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-test-placeholder
      - run: npm run lint
      - run: npm run build

  # Separate job from `verify` on purpose: E2E needs a browser download and a
  # built app on a server, so folding it in would add minutes to the check that
  # gates every push. It is also a distinct status context, which means it can
  # be adopted as a required check independently once it has a green history.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Chromium — the suite declares no other browser, and installing the
      # full set triples the download for no added coverage.
      - run: npx playwright install --with-deps chromium
      # Supabase credentials are deliberately absent: playwright.config.js
      # injects placeholders and every backend call is intercepted in-page.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
